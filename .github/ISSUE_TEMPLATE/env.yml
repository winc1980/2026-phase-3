name: 環境構築
description: 1人が自分のPCで、1つの技術を使える状態にする
title: "環境構築: "
labels: []
body:
  - type: input
    id: tech
    attributes:
      label: 技術
      description: 使えるようにするもの。バージョンが決まっていれば書く
      placeholder: "例：Node.js 24.21.0 / Flutter 3.47 / Python 3.14.8"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 自分のPC
      description: OSによって手順が変わることがあるので書いておく
      options:
        - Windows
        - Mac
        - Linux
        - その他
  - type: input
    id: docs
    attributes:
      label: 見ている公式ドキュメント
      description: インストール手順のページのURL。分からなければ空欄でよい
  - type: textarea
    id: done
    attributes:
      label: 完了の条件
      value: |
        - [ ] インストールしたものが動くことを、バージョンを表示して確かめた（例：`node -v`）
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: メモ（やったこと・詰まったこと）
      description: |
        実際にやった手順や、詰まったところとその解決方法。
        あとから同じ環境構築をする人の助けになります。
        参考にした記事のリンクを貼るだけでもよいです。
  - type: markdown
    attributes:
      value: |
        **詰まったら：** 他の人のメモ、資料を見る → AIに聞く → 15分で進まなければ人に聞く(@学習会メンタ)
